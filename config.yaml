# Phase 1 architecture configuration.
# Existing implementation paths are preserved and called through mission adapters.
paths:
  input: null
  mapping_video: mapping_video.mp4
  obstacle_video: null
  facility_video: null
  output_dir: outputs
  map_output_dir: data/map
  calibration: configs/calibration.json
  homography: ground_mission/configs/homography.pkl
  zones: ground_mission/configs/zones.yaml
  map_image: data/overview.jpg
  global_map: data/map/global_map.jpg
  map_info: data/map/map_info.json
  aruco_points: data/map/aruco_points.json

mapping:
  aruco:
    dictionary: DICT_5X5_50
    corner_ids: [4, 3, 1, 2]
    world_corners_cm: [[0.0, 0.0], [500.0, 0.0], [500.0, 400.0], [0.0, 400.0]]

calibration:
  aruco:
    marker_ids: [4, 3, 1, 2]
    marker_length: null  # Set to the measured marker side length; any consistent physical unit is valid.
    sample_interval: 10

models:
  obstacle:
    directory: models/obstacle
    weights: best.pt
    pretrained: yolo11s.pt
  facility:
    directory: models/facility
    weights: best.pt
    pretrained: yolo26n-cls.pt

missions:
  obstacle:
    adapter: ground_mission_obstacle_detection
    conf: 0.3
    imgsz: 640
    sample_interval: 10
    crater_count: 3
    uxo_count: 5
  mapping:
    adapter: aruco_homography
  facility:
    adapter: facility.run
